version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: socialx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: socialx
      POSTGRES_PASSWORD: socialx_secure_pass
      POSTGRES_DB: socialx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialx -d socialx_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: socialx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: socialx-s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialx-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://socialx:socialx_secure_pass@postgres:5432/socialx_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: socialx_production_access_secret_2026
      JWT_REFRESH_SECRET: socialx_production_refresh_secret_2026
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      S3_BUCKET_NAME: socialx-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: socialx-admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
