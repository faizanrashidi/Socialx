name: Socialx Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD is missing"; exit 1; }
          echo "All signing secrets are present."

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n[:space:]' | base64 --decode > "$RUNNER_TEMP/socialx-release.jks"
          test -s "$RUNNER_TEMP/socialx-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/socialx-release.jks" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            > /dev/null
          echo "Keystore verified successfully."

      - name: Build signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/socialx-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Socialx-release-apk
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error
